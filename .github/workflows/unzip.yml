name: Unpack and Build DDBZ
on:
  workflow_dispatch:
  push:
    paths:
      - 'ddbz5e-rpg-companion-source.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and generate manifest files
        run: |
          if [ -f "ddbz5e-rpg-companion-source.zip" ]; then
            unzip -o ddbz5e-rpg-companion-source.zip
            git rm -f ddbz5e-rpg-companion-source.zip
          fi
          python3 -c '
          import json, glob, os
          with open("ddbz5e/system.rpg.json", "r") as f:
              sys_data = json.load(f)
          instances = []
          for path in sorted(glob.glob("ddbz5e/resource_instances/**/*.rpg.json", recursive=True)):
              with open(path, "r") as f:
                  instances.append(json.load(f))
          manifest = [{"id": sys_data["id"], "name": sys_data["name"], "abbreviation": sys_data.get("abbreviation", "DDBZ"), "version": sys_data.get("version", "3.0.0"), "path": "ddbz5e/system.rpg.json"}]
          with open("systems.json", "w") as f:
              json.dump(manifest, f, indent=2)
          sys_bundle = dict(sys_data)
          sys_bundle["resource_instances"] = instances
          with open("systems.rpg", "w") as f:
              json.dump([sys_bundle], f, indent=2)
          '
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Unpack and build DDBZ release"
          git push
